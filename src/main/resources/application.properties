# ============================================================================
#  Secure CMS - main configuration
#  Secrets are NEVER written here. They come from environment variables or from
#  a local ".env" file (copy .env.example -> .env). See README "Environment Variables".
# ============================================================================
spring.application.name=secure-cms
server.port=8080

# Loads KEY=VALUE pairs from ./.env if the file exists (optional, ignored if missing)
spring.config.import=optional:file:.env[.properties]

# ---------- Database (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_cms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" is convenient for a college project. In real production use Flyway/Liquibase + "validate".
spring.jpa.hibernate.ddl-auto=update
# Disable Open-Session-In-View so lazy loading cannot silently hide N+1 problems in controllers
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Needed by the benchmark endpoint: counts the real number of SQL statements
spring.jpa.properties.hibernate.generate_statistics=true

# ---------- Pagination limits ----------
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-days=7

# ---------- AES (Base64 encoded 256-bit key) ----------
encryption.secret=${AES_SECRET_KEY}

# ---------- CORS (comma separated list of allowed frontend origins) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# ---------- Demo data (development only - set SEED_ENABLED=false in production) ----------
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ---------- Error handling ----------
server.error.include-message=never
server.error.include-stacktrace=never
