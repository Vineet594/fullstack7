spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.cache.type=caffeine
spring.cache.cache-names=categories,category,posts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
app.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=7
app.encryption.secret=test-only-aes-secret-0123456789abcdef0123456789
app.cors.allowed-origins=http://localhost:3000
app.seed.enabled=false
app.seed.demo-password=Test@12345
