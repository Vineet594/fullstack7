spring.application.name=secure-cms
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

# --- Database: MySQL locally, PostgreSQL on Render (set DB_TYPE=postgresql) ---
spring.datasource.url=jdbc:${DB_TYPE:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:securecms}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.generate_statistics=true

# --- Caching (Caffeine, in-memory) ---
spring.cache.type=caffeine
spring.cache.cache-names=categories,category,posts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# --- Application secrets: ALWAYS provided through environment variables ---
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=7
app.encryption.secret=${AES_SECRET_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Demo data (DEVELOPMENT / DEMO ONLY) ---
app.seed.enabled=${SEED_SAMPLE_DATA:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo@12345}

# --- Actuator / Swagger / Logging ---
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level correlationId=%X{correlationId:-none} [%thread] %logger{30} - %msg%n
